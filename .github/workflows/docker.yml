name: Docker

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/grimmory-format-automation

jobs:
  image:
    name: Build and publish service image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' }}
            type=raw,value=ci,enable=${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

      - name: Build (and publish outside pull requests)
        uses: docker/build-push-action@v6
        with:
          context: ./converter
          push: ${{ github.event_name == 'push' || github.event_name == 'release' }}
          load: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test health and bearer authentication
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          SMOKE_IMAGE: ghcr.io/${{ github.repository_owner }}/grimmory-format-automation:ci
        run: |
          set -euo pipefail
          SMOKE_IMAGE="${SMOKE_IMAGE,,}"
          docker run --detach --name grimmory-format-service-smoke --publish 18080:8080 \
            -e API_KEY=smoke-service-key \
            -e GRIMMORY_BASE_URL=http://127.0.0.1:9999 \
            -e GRIMMORY_USERNAME=smoke-user \
            -e GRIMMORY_PASSWORD=smoke-password \
            -e LIBRARY_IDS=1 \
            "${SMOKE_IMAGE}"
          trap 'docker rm --force grimmory-format-service-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" -eq 1

          # Protected endpoints must reject an absent key.
          if curl --fail --silent --show-error http://127.0.0.1:18080/formats >/dev/null; then
            echo "protected endpoint accepted an unauthenticated request"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H 'Authorization: Bearer smoke-service-key' \
            http://127.0.0.1:18080/formats >/dev/null
