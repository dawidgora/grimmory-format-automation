# Example only. Replace the value, or use an external/sealed Secret in
# production. Never commit a populated Secret manifest.
#
# API_KEY is the service's inbound bearer key. It is not a Grimmory credential.
# Remove this key and the Deployment will generate /data/api-key on first start;
# the PVC must then be retained for the key to remain stable.
apiVersion: v1
kind: Secret
metadata:
  name: grimmory-format-automation
  labels:
    app.kubernetes.io/name: grimmory-format-service
    app.kubernetes.io/part-of: grimmory-format-automation
type: Opaque
stringData:
  API_KEY: replace-with-a-long-random-api-key
  GRIMMORY_USERNAME: replace-with-a-grimmory-service-account
  GRIMMORY_PASSWORD: replace-with-the-grimmory-service-account-password
