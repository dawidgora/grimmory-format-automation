# Example only. Grimmory is an external API dependency; this manifest deploys
# the format automation service and does not install Grimmory or expose its
# library as local storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grimmory-format-service
  labels:
    app.kubernetes.io/name: grimmory-format-service
    app.kubernetes.io/part-of: grimmory-format-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grimmory-format-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grimmory-format-service
        app.kubernetes.io/part-of: grimmory-format-automation
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grimmory-format-service
          # Replace <owner> and pin a release tag in production.
          image: ghcr.io/<owner>/grimmory-format-automation:latest
          imagePullPolicy: IfNotPresent
          env:
            # Optional: omit API_KEY to generate and persist /data/api-key.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: grimmory-format-automation
                  key: API_KEY
                  optional: true
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "8080"
            - name: GRIMMORY_BASE_URL
              # Replace with the URL of the deployed Grimmory API.
              value: https://grimmory.example.invalid
            - name: GRIMMORY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grimmory-format-automation
                  key: GRIMMORY_USERNAME
            - name: GRIMMORY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grimmory-format-automation
                  key: GRIMMORY_PASSWORD
            - name: LIBRARY_IDS
              value: "1"
            - name: OUTPUT_FORMATS
              value: "mobi,azw3"
            - name: SUPPORTED_INPUT_FORMATS
              value: "epub,mobi,azw3"
            - name: MAX_CONCURRENT_BOOKS
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: format-service-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        # This claim must survive pod replacement so the generated API key and
        # SQLite state survive too.
        - name: format-service-data
          persistentVolumeClaim:
            claimName: grimmory-format-service-data
