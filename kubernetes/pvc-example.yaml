# Example claim for service credentials, SQLite state, and transient
# reconciliation bookkeeping. Keep it across pod upgrades.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-format-service-data
  labels:
    app.kubernetes.io/name: grimmory-format-service
    app.kubernetes.io/part-of: grimmory-format-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
